name: End-to-end

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: WordPress staging behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Build production autoloader
        run: composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build assets
        run: npm run build

      - name: Start disposable WordPress
        run: npm run env:start

      - name: Activate plugin
        run: npx wp-env run cli wp plugin activate wp-environment-guard

      - name: Check deployment invariants
        run: npx wp-env run cli wp environment-guard check

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable WordPress
        if: ${{ always() }}
        run: npm run env:stop
